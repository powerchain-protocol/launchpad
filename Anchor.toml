[toolchain]
anchor_version = "1.0.2"

[features]
resolution = true
skip-lint = false

[programs.localnet]
# Populated by `anchor keys sync` from target/deploy/*-keypair.json.
# Never replace with fabricated production IDs.

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm test:programs"
